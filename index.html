
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jokebear Vinyl Player</title>

<style>
body {
  margin: 0;
  background: #0b0b10;
  overflow: hidden;
  font-family: monospace;
}

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

input, button {
  padding: 10px;
  border: none;
  border-radius: 6px;
}

input { flex: 1; }

button {
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="login()">Login Spotify</button>
  <input id="playlist" placeholder="Paste Spotify playlist link" />
  <button onclick="playPlaylist()">Play</button>
</div>

<canvas id="c"></canvas>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<script>
/* =========================
CONFIG
========================= */
const clientId = "b70b154cbfe744d2b0c35abdae214abe";
const redirectUri = "https://cocobrmd.github.io/jokebear-2/";

<script>
const clientId = "b70b154cbfe744d2b0c35abdae214abe";
const redirectUri = "https://cocobrmd.github.io/jokebearvinyl/";

let token = null;
let player = null;
let deviceId = null;
let ready = false;

/* =========================
PKCE LOGIN
========================= */

window.login = function () {
  const scopes = [
    "streaming",
    "user-read-playback-state",
    "user-modify-playback-state"
  ].join(" ");

  const verifier = generateVerifier();
  
  generateChallenge(verifier).then(challenge => {

    localStorage.setItem("verifier", verifier);

    const authUrl =
      "https://accounts.spotify.com/authorize?" +
      "response_type=code" +
      "&client_id=" + encodeURIComponent(clientId) +
      "&scope=" + encodeURIComponent(scopes) +
      "&redirect_uri=" + encodeURIComponent(redirectUri) +
      "&code_challenge_method=S256" +
      "&code_challenge=" + challenge;

    window.location.href = authUrl;
  });
}

function generateVerifier(length = 128) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  let verifier = "";

  const random = new Uint8Array(length);
  crypto.getRandomValues(random);

  random.forEach(v => {
    verifier += chars[v % chars.length];
  });

  return verifier;
}

async function generateChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);

  const digest = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return btoa(
    String.fromCharCode(...new Uint8Array(digest))
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

/* =========================
TOKEN EXCHANGE
========================= */

async function handleRedirect() {

  const params = new URLSearchParams(
    window.location.search
  );

  const code = params.get("code");

  if (!code) return;

  const verifier = localStorage.getItem("verifier");

  if (!verifier) {
    alert("Missing PKCE verifier");
    return;
  }

  try {

    const body = new URLSearchParams({
      client_id: clientId,
      grant_type: "authorization_code",
      code,
      redirect_uri: redirectUri,
      code_verifier: verifier
    });

    const response = await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body
      }
    );

    const data = await response.json();

    if (!response.ok) {
      console.error(data);
      alert("Spotify login failed");
      return;
    }

    token = data.access_token;

    console.log("Token received");

    window.history.replaceState(
      {},
      document.title,
      redirectUri
    );

    if (window.Spotify) {
      initPlayer();
    }

  } catch (err) {
    console.error(err);
    alert("Token exchange failed");
  }
}

/* =========================
PLAYER
========================= */

function initPlayer() {

  if (player || !token) return;

  player = new Spotify.Player({
    name: "Jokebear Vinyl Player",
    getOAuthToken: cb => cb(token),
    volume: 0.8
  });

  player.addListener(
    "ready",
    ({ device_id }) => {

      deviceId = device_id;
      ready = true;

      console.log(
        "Spotify device ready:",
        deviceId
      );
    }
  );

  player.addListener(
    "not_ready",
    ({ device_id }) => {
      console.log(
        "Device offline:",
        device_id
      );
      ready = false;
    }
  );

  player.addListener(
    "initialization_error",
    e => console.error("Init error", e)
  );

  player.addListener(
    "authentication_error",
    e => console.error("Auth error", e)
  );

  player.addListener(
    "account_error",
    e => console.error("Account error", e)
  );

  player.addListener(
    "playback_error",
    e => console.error("Playback error", e)
  );

  player.connect();
}

window.onSpotifyWebPlaybackSDKReady = () => {

  console.log("Spotify SDK loaded");

  if (token) {
    initPlayer();
  }
};

/* =========================
PLAY PLAYLIST
========================= */

function extractId(url) {

  const match =
    url.match(/playlist\/([A-Za-z0-9]+)/);

  return match ? match[1] : null;
}

async function playPlaylist() {

  if (!token) {
    alert("Login first");
    return;
  }

  if (!ready) {
    alert("Player not ready");
    return;
  }

  const url =
    document.getElementById("playlist").value;

  const id = extractId(url);

  if (!id) {
    alert("Invalid playlist URL");
    return;
  }

  try {

    const transfer = await fetch(
      "https://api.spotify.com/v1/me/player",
      {
        method: "PUT",
        headers: {
          Authorization:
            "Bearer " + token,
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          device_ids: [deviceId],
          play: false
        })
      }
    );

    if (!transfer.ok) {
      console.error(
        "Transfer failed:",
        await transfer.text()
      );
    }

    await new Promise(r =>
      setTimeout(r, 1000)
    );

    const play = await fetch(
      "https://api.spotify.com/v1/me/player/play",
      {
        method: "PUT",
        headers: {
          Authorization:
            "Bearer " + token,
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          context_uri:
            "spotify:playlist:" + id
        })
      }
    );

    if (!play.ok) {
      console.error(
        "Play failed:",
        await play.text()
      );
      alert("Playback failed");
      return;
    }

  } catch (err) {
    console.error(err);
    alert("Playback error");
  }
}

handleRedirect();
</script>
