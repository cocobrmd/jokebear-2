
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jokebear Vinyl Player</title>

<style>
body {
  margin: 0;
  background: #0b0b10;
  overflow: hidden;
  font-family: monospace;
}

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

#status {
  position: fixed;
  top: 58px;
  left: 10px;
  right: 10px;
  color: #f7f7fb;
  z-index: 10;
}

input, button {
  padding: 10px;
  border: none;
  border-radius: 6px;
}

input { flex: 1; }

button {
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="login()">Login Spotify</button>
  <input id="playlist" placeholder="Paste Spotify playlist link" />
  <button onclick="playPlaylist()">Play</button>
</div>
<div id="status">Login to Spotify, then paste a playlist link.</div>

<canvas id="c"></canvas>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<script>
/* =========================
CONFIG
========================= */
const clientId = "b70b154cbfe744d2b0c35abdae214abe";
const redirectUri = "https://cocobrmd.github.io/jokebearvinyl/";

let token = null;
let player = null;
let deviceId = null;
let ready = false;
let isPlaying = false;
let rotation = 0;

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function drawVinyl() {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2 + 35;
  const radius = Math.min(w, h) * 0.32;

  ctx.clearRect(0, 0, w, h);

  const bg = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.max(w, h));
  bg.addColorStop(0, "#252032");
  bg.addColorStop(1, "#08080c");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.fillStyle = "#101015";
  ctx.fill();

  for (let i = 0; i < 24; i++) {
    ctx.beginPath();
    ctx.arc(0, 0, radius * (0.25 + i * 0.03), 0, Math.PI * 2);
    ctx.strokeStyle = i % 2 ? "#1d1d25" : "#292834";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (let i = 0; i < 10; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, i * 0.63, i * 0.63 + 0.08);
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = radius * 0.9;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.36, 0, Math.PI * 2);
  ctx.fillStyle = "#ff4d6d";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(-radius * 0.18, -radius * 0.18, radius * 0.13, 0, Math.PI * 2);
  ctx.arc(radius * 0.18, -radius * 0.18, radius * 0.13, 0, Math.PI * 2);
  ctx.fillStyle = "#2a1a1f";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.23, 0, Math.PI * 2);
  ctx.fillStyle = "#f7b7a9";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(-radius * 0.08, -radius * 0.03, radius * 0.025, 0, Math.PI * 2);
  ctx.arc(radius * 0.08, -radius * 0.03, radius * 0.025, 0, Math.PI * 2);
  ctx.fillStyle = "#111";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, radius * 0.08, radius * 0.07, 0.15, Math.PI - 0.15);
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.045, 0, Math.PI * 2);
  ctx.fillStyle = "#101015";
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = "#f7f7fb";
  ctx.font = "700 20px monospace";
  ctx.textAlign = "center";
  ctx.fillText("JOKEBEAR VINYL", cx, Math.max(120, cy - radius - 32));

  if (isPlaying) {
    rotation += 0.035;
  }

  requestAnimationFrame(drawVinyl);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
drawVinyl();

/* =========================
PKCE LOGIN
========================= */

function login() {
  setStatus("Opening Spotify login...");

  const scopes = [
    "streaming",
    "user-read-playback-state",
    "user-modify-playback-state"
  ].join(" ");

  const verifier = generateVerifier();
  
  generateChallenge(verifier).then(challenge => {

    localStorage.setItem("verifier", verifier);

    const authUrl =
      "https://accounts.spotify.com/authorize?" +
      "response_type=code" +
      "&client_id=" + encodeURIComponent(clientId) +
      "&scope=" + encodeURIComponent(scopes) +
      "&redirect_uri=" + encodeURIComponent(redirectUri) +
      "&code_challenge_method=S256" +
      "&code_challenge=" + challenge;

    window.location.href = authUrl;
  });
}

function generateVerifier(length = 128) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  let verifier = "";

  const random = new Uint8Array(length);
  crypto.getRandomValues(random);

  random.forEach(v => {
    verifier += chars[v % chars.length];
  });

  return verifier;
}

async function generateChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);

  const digest = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return btoa(
    String.fromCharCode(...new Uint8Array(digest))
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

/* =========================
TOKEN EXCHANGE
========================= */

async function handleRedirect() {

  const params = new URLSearchParams(
    window.location.search
  );

  const code = params.get("code");

  if (!code) return;

  const verifier = localStorage.getItem("verifier");

    if (!verifier) {
    setStatus("Login failed: missing PKCE verifier.");
    alert("Missing PKCE verifier");
    return;
  }

  try {

    const body = new URLSearchParams({
      client_id: clientId,
      grant_type: "authorization_code",
      code,
      redirect_uri: redirectUri,
      code_verifier: verifier
    });

    const response = await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body
      }
    );

    const data = await response.json();

    if (!response.ok) {
      console.error(data);
      setStatus("Spotify login failed. Check the browser console.");
      alert("Spotify login failed");
      return;
    }

    token = data.access_token;
    localStorage.setItem("spotify_token", token);

    console.log("Token received");
    setStatus("Logged in. Starting Spotify player...");

    window.history.replaceState(
      {},
      document.title,
      redirectUri
    );

    if (window.Spotify) {
      initPlayer();
    }

  } catch (err) {
    console.error(err);
    setStatus("Token exchange failed. Check the browser console.");
    alert("Token exchange failed");
  }
}

/* =========================
PLAYER
========================= */

function initPlayer() {

  if (player || !token) return;

  player = new Spotify.Player({
    name: "Jokebear Vinyl Player",
    getOAuthToken: cb => cb(token),
    volume: 0.8
  });

  player.addListener(
    "ready",
    ({ device_id }) => {

      deviceId = device_id;
      ready = true;
      setStatus("Spotify player ready. Paste a playlist and press Play.");

      console.log(
        "Spotify device ready:",
        deviceId
      );
    }
  );

  player.addListener(
    "not_ready",
    ({ device_id }) => {
      console.log(
        "Device offline:",
        device_id
      );
      ready = false;
      setStatus("Spotify player went offline. Try logging in again.");
    }
  );

  player.addListener(
    "initialization_error",
    e => {
      console.error("Init error", e);
      setStatus("Spotify player failed to initialize.");
    }
  );

  player.addListener(
    "authentication_error",
    e => {
      console.error("Auth error", e);
      setStatus("Spotify authentication failed. Try logging in again.");
    }
  );

  player.addListener(
    "account_error",
    e => {
      console.error("Account error", e);
      setStatus("Spotify account error. Web Playback requires Spotify Premium.");
    }
  );

  player.addListener(
    "playback_error",
    e => {
      console.error("Playback error", e);
      setStatus("Spotify playback error. Check the browser console.");
    }
  );

  player.connect();
  setStatus("Connecting to Spotify player...");
}

window.onSpotifyWebPlaybackSDKReady = () => {

  console.log("Spotify SDK loaded");
  setStatus(token ? "Spotify SDK loaded. Starting player..." : "Spotify SDK loaded. Login to continue.");

  if (token) {
    initPlayer();
  }
};

/* =========================
PLAY PLAYLIST
========================= */

function extractId(url) {

  const match =
    url.match(/(?:playlist\/|spotify:playlist:)([A-Za-z0-9]+)/);

  return match ? match[1] : null;
}

async function playPlaylist() {

  if (!token) {
    setStatus("Login first.");
    alert("Login first");
    return;
  }

  if (!ready) {
    setStatus("Player not ready yet. Wait a moment, then try again.");
    alert("Player not ready");
    return;
  }

  const url =
    document.getElementById("playlist").value;

  const id = extractId(url);

  if (!id) {
    setStatus("That does not look like a Spotify playlist link.");
    alert("Invalid playlist URL");
    return;
  }

  try {
    setStatus("Transferring playback to Jokebear Vinyl Player...");

    const transfer = await fetch(
      "https://api.spotify.com/v1/me/player",
      {
        method: "PUT",
        headers: {
          Authorization:
            "Bearer " + token,
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          device_ids: [deviceId],
          play: false
        })
      }
    );

    if (!transfer.ok) {
      console.error(
        "Transfer failed:",
        await transfer.text()
      );
      setStatus("Could not transfer Spotify playback. Check Premium/login/device state.");
    }

    await new Promise(r =>
      setTimeout(r, 1000)
    );

    const play = await fetch(
      "https://api.spotify.com/v1/me/player/play",
      {
        method: "PUT",
        headers: {
          Authorization:
            "Bearer " + token,
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          context_uri:
            "spotify:playlist:" + id
        })
      }
    );

    if (!play.ok) {
      console.error(
        "Play failed:",
        await play.text()
      );
      setStatus("Playback failed. Check that the playlist is playable on this account.");
      alert("Playback failed");
      return;
    }

    isPlaying = true;
    setStatus("Playing playlist on the Jokebear vinyl.");

  } catch (err) {
    console.error(err);
    setStatus("Playback error. Check the browser console.");
    alert("Playback error");
  }
}

token = localStorage.getItem("spotify_token");
handleRedirect();

if (token && window.Spotify) {
  initPlayer();
}
</script>
